apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-bill-deployment
  labels:
    app: shopping-bill
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-bill
  template:
    metadata:
      labels:
        app: shopping-bill
    spec:
      containers:
      - name: shopping-bill
        image: PLACEHOLDER_IMAGE
        ports:
        - containerPort: 5000
