name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
    # Stage 1 & 2: Source Code & Version Control Check
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Stage 3: Continuous Integration (Test Environment Setup)
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Automated Tests
      run: |
        pytest test_app.py

    # Stage 4: Docker Build and Registry Push
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set Image Tag
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:${{ steps.vars.outputs.sha_short }}

    # Stage 5: Target Deployment Infrastructure Generation & Deployment
    - name: Start Local Kubernetes Cluster inside Runner
      uses: flaky-duck/minikube-action@v0.0.4
      with:
        driver: docker

    - name: Deploy Image to Pipeline Cluster & Expose Service
      run: |
        # Inject the unique tag dynamically into the deployment manifest
        sed -i 's|image: PLACEHOLDER_IMAGE|image: ${{ secrets.DOCKERHUB_USERNAME }}/shopping-bill:${{ steps.vars.outputs.sha_short }}|g' deployment.yaml
        
        # Apply the configurations to the pipeline runner cluster
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        
        # Verify the deployment state satisfies the question criteria
        echo "=== VERIFYING KUBERNETES INFRASTRUCTURE SPECS ==="
        kubectl rollout status deployment/shopping-bill-deployment --timeout=90s
        kubectl get deployments
        kubectl get pods -l app=shopping-bill
        kubectl get svc shopping-bill-service
